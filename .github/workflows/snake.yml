

name: Generate Pixel Snake

on:
  schedule:
    - cron: "0 0 * * *"  
  workflow_dispatch:        
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: speed-velocity
          outputs: |
            dist/pixel-snake.svg?color_snake=%2339FF14&color_dots=%230d1117,%23145a32,%231e8449,%2327ae60,%2339ff14
            dist/pixel-snake-dark.svg?palette=github-dark&color_snake=%2339FF14
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "chore: update pixel snake [skip ci]"
